name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          # Dummy URL so prisma generate succeeds without a real DB
          DATABASE_URL: postgresql://user:pass@localhost:5432/rksad?schema=public

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npx tsc
